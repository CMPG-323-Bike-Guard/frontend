<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BikeGuard - Crossing Log</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="crossing-log.css">
</head>
<body>
  <div class="app page">
    <nav class="sidebar-nav">
      <div>
        <div class="brand" style="padding:16px 18px 10px; color:white;">
          <div class="logo"><img src="../images/logo.svg" alt="BikeGuard" /></div>
          <div style="margin-left:10px;"><h1 style="font-size:16px; margin:0;">BikeGuard</h1></div>
        </div>
        <div class="menu">
          <a href="gate-board.html">Gate Board</a>
          <a href="manual-checks.html">Manual Checks</a>
          <a href="crossing-log.html" class="active">Crossing Log</a>
        </div>
      </div>
      <div>
        <div class="user-details">
          <div class="user-icon">👤</div>
          <div>
            <div id="sidebar-user-name" class="user-name">Guard User</div>
            <div id="sidebar-user-id" class="user-id">GUARD001</div>
          </div>
        </div>
        <button id="signout-button" class="signout-link" type="button">Sign out</button>
      </div>
    </nav>

    <main class="main">
      <div class="container">
        <div class="page-header" style="margin-bottom:12px;">
          <div>
            <h2 style="margin:0; font-size:36px;">Crossing Log</h2>
          </div>
          <button id="export-csv" class="btn btn-primary">Export CSV</button>
        </div>

        <div class="card table-wrap">
          <div style="display:flex; gap:8px; align-items:center; margin-bottom:12px;">
            <select id="crossing-gate" class="input">
              <option value="">All gates</option>
              <option>Gate 1</option>
              <option>Gate 2</option>
              <option>Gate 3</option>
              <option>Gate 4</option>
              <option>Gate 5</option>
              <option>Gate 6</option>
              <option>Gate 7</option>
              <option>Gate 8</option>
              <option>Gate 9</option>
            </select>
            <input id="crossing-student" class="input" type="text" placeholder="Student number" />
            <select id="crossing-result" class="input">
              <option value="">Any</option>
              <option>Success</option>
              <option>Alarm</option>
              <option>Resolved</option>
            </select>
            <input id="crossing-date" class="input" type="date" max="" />
          </div>
          <table class="table">
            <thead>
              <tr>
                <th>When</th>
                <th>Person</th>
                <th>Bike</th>
                <th>Gate</th>
                <th>Tag</th>
                <th>Result</th>
                <th>Check</th>
              </tr>
            </thead>
            <tbody id="crossing-body"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  <script src="../js/app.js"></script>
</body>
</html>
