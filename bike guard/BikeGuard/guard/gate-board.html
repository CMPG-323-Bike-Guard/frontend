<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BikeGuard - Gate Board</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="gate-board.css">
</head>
<body>
  <div class="app page">
    <nav class="sidebar-nav">
      <div>
        <div class="brand" style="padding:16px 18px 10px; color:white;">
          <div class="logo"><img src="../images/logo.svg" alt="BikeGuard" /></div>
          <div style="margin-left:10px;"><h1 style="font-size:16px; margin:0;">BikeGuard</h1></div>
        </div>
        <div class="menu">
          <a href="gate-board.html" class="active">Gate Board</a>
          <a href="manual-checks.html">Manual Checks</a>
          <a href="crossing-log.html">Crossing Log</a>
        </div>
      </div>
      <div>
        <div class="user-details">
          <div class="user-icon">👤</div>
          <div>
            <div id="sidebar-user-name" class="user-name">Guard User</div>
            <div id="sidebar-user-id" class="user-id">GUARD001</div>
          </div>
        </div>
        <button id="signout-button" class="signout-link" type="button">Sign out</button>
      </div>
    </nav>

    <main class="main">
      <div class="container">
        <div class="grid-3" style="margin-bottom:16px;">
          <div class="card summary-tile"><div class="summary-label">Crossings today</div><div id="k-crossings" class="summary-value">0</div></div>
          <div class="card summary-tile"><div class="summary-label">Open alarms</div><div id="k-alarms" class="summary-value">0</div></div>
          <div class="card summary-tile"><div class="summary-label">Gates on manual</div><div id="k-manual" class="summary-value">0</div></div>
        </div>

        <div class="gate-board-row">
          <div class="card gate-board-section" style="padding:18px;">
            <h3>Current gate activity</h3>
            <div id="gate-activity" class="gate-activity-list"></div>
          </div>

          <div class="card gate-board-section" style="padding:18px;">
            <h3>Alarms requiring attention</h3>
            <div id="alarms-list" class="alarm-list alarm-list-vertical"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="../js/app.js"></script>
</body>
</html>
