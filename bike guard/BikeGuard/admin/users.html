<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BikeGuard - Users</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="users.css">
</head>
<body>
  <div class="app page">
    <nav class="sidebar-nav">
      <div>
        <div class="brand" style="padding:16px 18px 10px; color:white;">
          <div class="logo"><img src="../images/logo.svg" alt="BikeGuard" /></div>
          <div style="margin-left:10px;"><h1 style="font-size:16px; margin:0;">BikeGuard</h1></div>
        </div>
        <div class="menu">
          <a href="registrations.html">Registrations</a>
          <a href="tags.html">Tags</a>
          <a href="users.html" class="active">Users</a>
          <a href="reports.html">Reports</a>
        </div>
      </div>
      <div>
        <div class="user-details">
          <div class="user-icon">👤</div>
          <div>
            <div id="sidebar-user-name" class="user-name">Admin User</div>
            <div id="sidebar-user-id" class="user-id">ADMIN001</div>
          </div>
        </div>
        <button id="signout-button" class="signout-link" type="button">Sign out</button>
      </div>
    </nav>

    <main class="main">
      <div class="container">
        <h2>User Management</h2>
        <p class="subheading">Manage system users and their roles.</p>

        <div class="card action-panel" style="margin-bottom:12px;">
          <h3 class="subtle-text">Actions</h3>
          <div>
            <button id="add-user-btn" class="btn btn-primary" type="button">Add User</button>
          </div>
        </div>

        <div class="card table-wrap">
          <table class="table">
            <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Actions</th></tr></thead>
            <tbody id="users-body"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  <script src="../js/app.js"></script>
</body>
</html>
