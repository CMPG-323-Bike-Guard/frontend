<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BikeGuard - My Bikes</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="my-bikes.css">
</head>
<body>
  <div class="app page">
    <nav class="sidebar-nav">
      <div>
        <div class="brand" style="padding:16px 18px 10px; color:white;">
          <div class="logo"><img src="../images/logo.svg" alt="BikeGuard" /></div>
          <div style="margin-left:10px;"><h1 style="font-size:16px; margin:0;">BikeGuard</h1></div>
        </div>
        <div class="menu">
          <a href="my-bikes.html" class="active">My Bikes</a>
          <a href="register-bike.html">Register Bike</a>
          <a href="account.html">Account</a>
        </div>
      </div>
      <div>
        <div class="user-details">
          <div class="user-icon">👤</div>
          <div>
            <div id="sidebar-user-name" class="user-name">Student User</div>
            <div id="sidebar-user-id" class="user-id">NWU12345</div>
          </div>
        </div>
        <button id="signout-button" class="signout-link" type="button">Sign out</button>
      </div>
    </nav>

    <main class="main">
      <div class="container">
        <h2>My Bikes</h2>
        <p class="subheading">Manage your registered bikes and access controls.</p>

        <div class="bikes" id="my-bikes-list"></div>

        <div class="card action-panel" style="margin-top:24px;">
          <div>
            <h3>Shared Access</h3>
            <div class="subtle-text">Manage which users can access each bike.</div>
          </div>
        </div>
        <div class="card" style="padding:16px; margin-top:10px;">
          <div id="shared-access-overview" class="access-overview"></div>
          <div style="margin-top:12px; display:flex; gap:8px; align-items:center;">
            <select id="shared-access-bike-select" class="input" style="width:220px;"></select>
            <input id="shared-access-add-number" class="input" type="text" placeholder="Student number (8 digits)" maxlength="8" />
            <button id="shared-access-add-btn" class="btn btn-primary">Add User</button>
          </div>
        </div>

        <div id="removed-bikes-list" class="removed-bikes-wrap" style="margin-top:12px;"></div>
      </div>
    </main>
  </div>
  <script src="../js/app.js"></script>
</body>
</html>
